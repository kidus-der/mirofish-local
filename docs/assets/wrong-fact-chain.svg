<svg viewBox="0 0 1040 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-chain-title fig-chain-desc" width="1040" height="256"><title id="fig-chain-title">How one wrong fact reached the first report</title><desc id="fig-chain-desc">A lost job title became a false persona, then a simulated statement, then a stored fact, then a report claim.</desc><defs><marker id="fig-chain-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fig-chain-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="fig-chain-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><rect x="16" y="72" width="168" height="48" fill="rgba(45,49,66,0.05)" data-role="rail" data-step="s0" data-index="1"/><text x="100" y="24" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600" letter-spacing="0.14em">01</text><line x1="100" y1="32" x2="100" y2="60" stroke="#bfc0c0"/><circle cx="100" cy="96" r="32" fill="#f5f5f5"/><circle cx="100" cy="96" r="32" fill="#f5f5f5" stroke="#2d3142"/><text x="100" y="99" fill="#2d3142" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="500">SEED</text><text x="100" y="152" fill="#2d3142" font-size="13.68" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Source</text><text x="100" y="172" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Seed says</text><text x="100" y="188" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Mayor Ilse Varga</text><rect x="184" y="72" width="168" height="48" fill="rgba(45,49,66,0.09)" data-role="rail" data-step="s1" data-index="2"/><text x="268" y="24" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600" letter-spacing="0.14em">02</text><line x1="268" y1="32" x2="268" y2="60" stroke="#bfc0c0"/><circle cx="268" cy="96" r="32" fill="#f5f5f5"/><circle cx="268" cy="96" r="32" fill="#f5f5f5" stroke="#2d3142"/><text x="268" y="99" fill="#2d3142" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="500">GRAPH</text><text x="268" y="152" fill="#2d3142" font-size="13.68" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Graph</text><text x="268" y="172" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Stored facts never</text><text x="268" y="188" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">mention she is mayor</text><rect x="352" y="72" width="168" height="48" fill="rgba(45,49,66,0.05)" data-role="rail" data-step="s2" data-index="3"/><text x="436" y="24" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600" letter-spacing="0.14em">03</text><line x1="436" y1="32" x2="436" y2="60" stroke="#bfc0c0"/><circle cx="436" cy="96" r="32" fill="#f5f5f5"/><circle cx="436" cy="96" r="32" fill="#f5f5f5" stroke="#2d3142"/><text x="436" y="99" fill="#2d3142" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="500">PERSONA</text><text x="436" y="152" fill="#2d3142" font-size="13.68" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Persona</text><text x="436" y="172" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">She becomes a</text><text x="436" y="188" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">community organizer</text><rect x="520" y="72" width="168" height="48" fill="rgba(45,49,66,0.09)" data-role="rail" data-step="s3" data-index="4"/><text x="604" y="24" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600" letter-spacing="0.14em">04</text><line x1="604" y1="32" x2="604" y2="60" stroke="#bfc0c0"/><circle cx="604" cy="96" r="32" fill="#f5f5f5"/><circle cx="604" cy="96" r="32" fill="#f5f5f5" stroke="#2d3142"/><text x="604" y="99" fill="#2d3142" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="500">POST</text><text x="604" y="152" fill="#2d3142" font-size="13.68" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Simulated post</text><text x="604" y="172" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Her agent repeats</text><text x="604" y="188" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">that invented role</text><rect x="688" y="72" width="168" height="48" fill="rgba(191,69,32,0.08)" data-role="rail" data-step="s4" data-index="5" data-focal="true"/><line x1="688" y1="72" x2="856" y2="72" stroke="#bf4520"/><line x1="688" y1="120" x2="856" y2="120" stroke="#bf4520"/><text x="772" y="24" fill="#bf4520" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600" letter-spacing="0.14em">05</text><line x1="772" y1="32" x2="772" y2="60" stroke="#bf4520"/><circle cx="772" cy="96" r="32" fill="#f5f5f5"/><circle cx="772" cy="96" r="32" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><text x="772" y="99" fill="#bf4520" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="500">MEMORY</text><text x="772" 