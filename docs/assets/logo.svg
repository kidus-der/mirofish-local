<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">MiroFish Local</title>
  <desc id="logo-desc">A fish made of connected agents swims inside a dashed local boundary. A data packet reaches the boundary and stops.</desc>
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ring, .fish, .tail, .node, .packet, .stop { transform-box: fill-box; transform-origin: center; }
    .ring { animation: turn 42s linear infinite; }
    .fish { animation: swim 5.6s ease-in-out infinite; }
    .tail { transform-origin: right center; animation: wag 1.4s ease-in-out infinite; }
    .node { animation: pulse 2.8s ease-in-out infinite; }
    .n2 { animation-delay: .45s; } .n3 { animation-delay: .9s; } .n4 { animation-delay: 1.35s; }
    .packet { animation: leave 5.6s ease-in infinite; }
    .stop { opacity: 0; animation: refuse 5.6s linear infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes swim { 0%, 100% { transform: translate(-4px, 3px); } 50% { transform: translate(5px, -4px); } }
    @keyframes wag { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 45% { opacity: 1; } }
    @keyframes leave { 0%, 12% { transform: translateX(0); opacity: 0; } 18% { opacity: 1; } 58% { transform: translateX(39px); opacity: 1; } 66%, 100% { transform: translateX(39px); opacity: 0; } }
    @keyframes refuse { 0%, 56% { opacity: 0; } 60%, 74% { opacity: 1; } 84%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ring, .fish, .tail, .node, .packet { animation: none; } .packet { opacity: 0; } .stop { animation: none; opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="959" height="239" rx="12" fill="#f5f5f5" stroke="#bfc0c0"/>
  <circle class="ring" cx="128" cy="120" r="92" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="7 7"/>
  <g class="fish">
    <path class="tail" d="M78 120 L49 95 Q60 120 49 145 Z" fill="#ffffff" stroke="#2d3142" stroke-width="2" stroke-linejoin="round"/>
    <path d="M73 120 C95 83 151 80 184 120 C151 160 95 157 73 120 Z" fill="#ffffff" stroke="#2d3142" stroke-width="2"/>
    <path d="M101 124 L126 103 L147 127 L121 139 Z M126 103 L121 139" fill="none" stroke="#4f5d75" stroke-width="1.3"/>
    <circle class="node" cx="101" cy="124" r="5" fill="#4f5d75"/>
    <circle class="node n2" cx="126" cy="103" r="5" fill="#2d3142"/>
    <circle class="node n3" cx="147" cy="127" r="5" fill="#bf4520"/>
    <circle class="node n4" cx="121" cy="139" r="5" fill="#4f5d75"/>
    <circle cx="166" cy="112" r="3" fill="#2d3142"/>
  </g>
  <circle class="packet" cx="181" cy="120" r="3.5" fill="#bf4520"/>
  <g class="stop" fill="none" stroke="#bf4520" stroke-width="1.6">
    <circle cx="220" cy="120" r="8" fill="#f5f5f5"/>
    <path d="M216.5 116.5 L223.5 123.5 M223.5 116.5 L216.5 123.5"/>
  </g>
  <text class="serif" x="268" y="124" font-size="72" fill="#2d3142">MiroFish <tspan fill="#bf4520" font-style="italic">Local</tspan></text>
  <text class="mono" x="271" y="162" font-size="14" letter-spacing="2.2" fill="#4f5d75">SWARM SIMULATION THAT STAYS ON YOUR MACHINE</text>
</svg>
