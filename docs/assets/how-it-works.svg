<svg viewBox="0 0 1040 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-title how-it-works-desc" width="1040" height="256"><title id="how-it-works-title">How MiroFish works</title><desc id="how-it-works-desc">Six stages turn documents and a question into a simulated debate and a written report.</desc><defs><marker id="how-it-works-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="how-it-works-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="how-it-works-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><rect x="16" y="72" width="168" height="48" fill="rgba(45,49,66,0.05)" data-role="rail" data-step="s0" data-index="1"/><text x="100" y="24" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600" letter-spacing="0.14em">01</text><line x1="100" y1="32" x2="100" y2="60" stroke="#bfc0c0"/><circle cx="100" cy="96" r="32" fill="#f5f5f5"/><circle cx="100" cy="96" r="32" fill="#f5f5f5" stroke="#2d3142"/><text x="100" y="99" fill="#2d3142" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="500">DOCS</text><text x="100" y="152" fill="#2d3142" font-size="13.68" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Seed and ontology</text><text x="100" y="172" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Documents, question,</text><text x="100" y="188" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">entity types</text><rect x="184" y="72" width="168" height="48" fill="rgba(45,49,66,0.09)" data-role="rail" data-step="s1" data-index="2"/><text x="268" y="24" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600" letter-spacing="0.14em">02</text><line x1="268" y1="32" x2="268" y2="60" stroke="#bfc0c0"/><circle cx="268" cy="96" r="32" fill="#f5f5f5"/><circle cx="268" cy="96" r="32" fill="#f5f5f5" stroke="#2d3142"/><text x="268" y="99" fill="#2d3142" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="500">GRAPH</text><text x="268" y="152" fill="#2d3142" font-size="13.68" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Knowledge graph</text><text x="268" y="172" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Text becomes dated</text><text x="268" y="188" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">facts and entities</text><rect x="352" y="72" width="168" height="48" fill="rgba(45,49,66,0.05)" data-role="rail" data-step="s2" data-index="3"/><text x="436" y="24" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600" letter-spacing="0.14em">03</text><line x1="436" y1="32" x2="436" y2="60" stroke="#bfc0c0"/><circle cx="436" cy="96" r="32" fill="#f5f5f5"/><circle cx="436" cy="96" r="32" fill="#f5f5f5" stroke="#2d3142"/><text x="436" y="99" fill="#2d3142" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="500">BOTS</text><text x="436" y="152" fill="#2d3142" font-size="13.68" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Agents</text><text x="436" y="172" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Each entity gets a</text><text x="436" y="188" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">persona and plan</text><rect x="520" y="72" width="168" height="48" fill="rgba(191,69,32,0.08)" data-role="rail" data-step="s3" data-index="4" data-focal="true"/><line x1="520" y1="72" x2="688" y2="72" stroke="#bf4520"/><line x1="520" y1="120" x2="688" y2="120" stroke="#bf4520"/><text x="604" y="24" fill="#bf4520" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600" letter-spacing="0.14em">04</text><line x1="604" y1="32" x2="604" y2="60" stroke="#bf4520"/><circle cx="604" cy="96" r="32" fill="#f5f5f5"/><circle cx="604" cy="96" r="32" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><text x="604" y="99" fill="#bf4520" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="500">SIM</text><text x="604" y="152" fill="#bf4520" font-size="13.68" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Simulation</text><text x="604" y="172" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Agents act on fake</text><text x="604" y="188" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Twitter and Reddit</text><rect x="688" y="72" width="168" height="48" fill="rgba(45,49,66,0.05)" data-role="rail" data-step="s4" data-index="5"/><text x="772" y="24" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600" letter-spacing="0.14em">05</text><line x1="772" y1="32" x2="772" y2="60" stroke="#bfc0c0"/><circle cx="772" cy="96" r="32" fill="#f5f5f5"/><circle cx="772" cy="96" r="32" fill="#f5f5f5" stroke="#2d3142"/><text x="772" y="99" fill="#2d3142" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="500">MEM</text><text x="772" y="152" fill="#2d3142" font-size="13.68" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Memory</text><text x="772" y="172" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Actions return to</text><text x="772" y="188" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the graph, labelled</text><rect x="856" y="72" width="168" height="48" fill="rgba(45,49,66,0.09)" data-role="rail" data-step="s5" data-index="6"/><text x="940" y="24" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="600" letter-spacing="0.14em">06</text><line x1="940" y1="32" x2="940" y2="60" stroke="#bfc0c0"/><circle cx="940" cy="96" r="32" fill="#f5f5f5"/><circle cx="940" cy="96" r="32" fill="#f5f5f5" stroke="#2d3142"/><text x="940" y="99" fill="#2d3142" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="500">REPORT</text><text x="940" y="152" fill="#2d3142" font-size="13.68" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Report</text><text x="940" y="172" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">An agent searches</text><text x="940" y="188" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">and writes findings</text><line x1="16" y1="216" x2="1024" y2="216" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/><text x="16" y="240" fill="#4f5d75" font-size="15.96" font-family="'Instrument Serif', serif" text-anchor="start" font-style="italic">Equal spacing shows order, not elapsed time.</text></svg>
