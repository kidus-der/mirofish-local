<svg viewBox="0 0 1040 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-use-title fig-use-desc" width="1040" height="504"><title id="fig-use-title">Where MiroFish is worth using</title><desc id="fig-use-desc">Scenario and objection work has high value and low risk, while forecasts and evidence claims carry high risk.</desc><defs><marker id="fig-use-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fig-use-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="fig-use-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><line x1="96" y1="240" x2="944" y2="240" stroke="#2d3142" marker-end="url(#fig-use-arrow)"/><line x1="520" y1="444" x2="520" y2="36" stroke="#2d3142" marker-end="url(#fig-use-arrow)"/><text x="956" y="243" fill="#2d3142" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">RISK</text><text x="520" y="24" fill="#2d3142" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">VALUE</text><text x="112" y="60" fill="#bf4520" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">USE IT</text><text x="928" y="60" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" font-weight="500" letter-spacing="0.14em">TEMPTING, UNSAFE</text><text x="112" y="432" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">CHEAP EXTRAS</text><text x="928" y="432" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" font-weight="500" letter-spacing="0.14em">AVOID</text><circle cx="180" cy="104" r="4" fill="#bf4520" stroke="#bf4520" stroke-width="1.2"/><text x="190" y="108" fill="#bf4520" font-size="12.54" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Find objections and factions</text><circle cx="216" cy="152" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="226" y="156" fill="#2d3142" font-size="12.54" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="500">Stress-test a message</text><circle cx="150" cy="200" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="160" y="204" fill="#2d3142" font-size="12.54" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="500">Decide what to ask real people</text><circle cx="620" cy="112" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="630" y="116" fill="#2d3142" font-size="12.54" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="500">Forecast a vote or market</text><circle cx="580" cy="176" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="590" y="180" fill="#2d3142" font-size="12.54" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="500">Estimate public opinion splits</text><circle cx="170" cy="300" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="180" y="304" fill="#2d3142" font-size="12.54" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="500">Learn how simulators fail</text><circle cx="240" cy="372" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="250" y="376" fill="#2d3142" font-size="12.54" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="500">Draft a stakeholder list</text><circle cx="610" cy="312" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="620" y="316" fill="#2d3142" font-size="12.54" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="500">Quote agents as evidence</text><circle cx="580" cy="380" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="590" y="384" fill="#2d3142" font-size="12.54" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="500">Treat agent count as sample size</text><line x1="16" y1="468" x2="1024" y2="468" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/><text x="16" y="488" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text><circle cx="104" cy="484" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/><text x="118" y="488" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">use</text><circle cx="169" cy="484" r="4" fill="#bf4520"/><text x="183" y="488" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">best use</text><text x="1024" y="488" fill="#4f5d75" font-size="14.82" font-family="'Instrument Serif', serif" text-anchor="end" font-style="italic">Placement is our judgement from this test and the published evidence.</text></svg>
