<svg viewBox="0 0 1040 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-layers-title fig-layers-desc" width="1040" height="432"><title id="fig-layers-title">How local-only is enforced</title><desc id="fig-layers-desc">Five overlapping controls reduce the chance of data leaving the Mac, with a stated remaining risk.</desc><defs><marker id="fig-layers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fig-layers-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="fig-layers-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="96" y="20" fill="#4f5d75" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">RISK ENTERING THE STACK</text><text x="96" y="38" fill="#2d3142" font-size="13.68" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">A prompt, document or simulated post leaves this Mac</text><line x1="56" y1="44" x2="56" y2="360" stroke="#bf4520" stroke-dasharray="5,4" marker-end="url(#fig-layers-accent)"/><text x="44" y="56" fill="#4f5d75" font-size="7.98" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" font-weight="500" letter-spacing="0.1em">PREVENT</text><text x="44" y="322" fill="#4f5d75" font-size="7.98" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" font-weight="500" letter-spacing="0.1em">DETECT</text><rect x="96" y="52" width="928" height="60" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="112" y="86" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500">L1</text><text x="148" y="78" fill="#2d3142" font-size="14.82" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Local-only configuration</text><text x="148" y="96" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">The app refuses a model address that is not on this machine</text><text x="636" y="74" fill="#5a6580" font-size="7.98" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">STILL ESCAPES</text><text x="636" y="92" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Code that ignores the app&#x27;s settings</text><rect x="96" y="112" width="928" height="60" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="112" y="146" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500">L2</text><text x="148" y="138" fill="#2d3142" font-size="14.82" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Python network guard</text><text x="148" y="156" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Blocks non-loopback sockets and DNS, including child processes</text><text x="636" y="134" fill="#5a6580" font-size="7.98" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">STILL ESCAPES</text><text x="636" y="152" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Native code that bypasses Python</text><rect x="96" y="172" width="928" height="60" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="112" y="206" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500">L3</text><text x="148" y="198" fill="#2d3142" font-size="14.82" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">macOS sandbox</text><text x="148" y="216" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Kernel rule denies outbound traffic except loopback</text><text x="636" y="194" fill="#5a6580" font-size="7.98" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">STILL ESCAPES</text><text x="636" y="212" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Programs started outside the sandbox</text><rect x="96" y="232" width="928" height="60" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="112" y="266" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500">L4</text><text x="148" y="258" fill="#2d3142" font-size="14.82" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Ollama lockdown</text><text x="148" y="276" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Private loopback address, cloud features switched off</text><text x="636" y="254" fill="#5a6580" font-size="7.98" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">STILL ESCAPES</text><text x="636" y="272" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">A fault inside Ollama itself</text><rect x="96" y="292" width="928" height="60" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><text x="112" y="326" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500">L5</text><text x="148" y="318" fill="#2d3142" font-size="14.82" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Connection watcher</text><text x="148" y="336" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Checked sockets every 5 seconds: 957 checks, 0 outside</text><text x="636" y="314" fill="#5a6580" font-size="7.98" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">STILL ESCAPES</text><text x="636" y="332" fill="#4f5d75" font-size="10.26" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Connections shorter than 5 seconds</text><rect x="96" y="364" width="928" height="52" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="112" y="384" fill="#bf4520" font-size="9.12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">RESIDUAL RISK</text><text x="112" y="402" fill="#bf4520" font-size="13.68" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Ollama runs outside the sandbox, and Apple has deprecated sandbox-exec.</text></svg>
